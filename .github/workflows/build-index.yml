name: build-index

# 一覧用の目次（days）を、保存済みの全記事から作り直す。初回と、目次の形を変えたときだけ手動で実行する
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci && npm run build
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/723210521199/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@prtimes-inbox.iam.gserviceaccount.com
      - name: 目次を作る
        run: node scripts/build-index.cjs
