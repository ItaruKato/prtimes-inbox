name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: prtimes-inbox
  # scripts/setup-gcp.sh の最後に表示される番号（秘密情報ではない）。空のあいだはデプロイしない
  PROJECT_NUMBER: '723210521199'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: 画面のテストとビルド
        run: npm ci && npm test && npm run build
      - name: 取得処理のビルドとテスト
        working-directory: functions
        run: npm ci && npm run build && npm test

      - name: Google Cloud に認証
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.PROJECT_NUMBER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
      - name: 通知の送信・音声の書き起こしに必要な API を有効にする
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.PROJECT_NUMBER != ''
        run: gcloud services enable fcm.googleapis.com fcmregistrations.googleapis.com firebaseinstallations.googleapis.com speech.googleapis.com --project "$PROJECT_ID"
      - name: Firebase にデプロイ（画面・関数・データベースのルール）
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.PROJECT_NUMBER != ''
        run: npx -y firebase-tools@14.11.0 deploy --only hosting,functions,firestore:rules --project "$PROJECT_ID" --non-interactive --force
      # 索引は別に出す。ベクトル索引（kbIndex の emb）は、すでにあっても firebase-tools が「無い」と見て作ろうとし 409 になるため、
      # ここが失敗しても画面・関数の反映は止めない。--force は付けない（ファイルにない索引を消さない）
      - name: Firestore の索引
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.PROJECT_NUMBER != ''
        continue-on-error: true
        run: npx -y firebase-tools@14.11.0 deploy --only firestore:indexes --project "$PROJECT_ID" --non-interactive
