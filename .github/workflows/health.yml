name: health

# 本番の健康診断（Firestore の状態・直近のエラー・公開ページ）。手動実行と、毎日朝7時半（JST）。
on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci && npm run build
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/723210521199/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@prtimes-inbox.iam.gserviceaccount.com
      - name: 健康診断
        run: node scripts/health.cjs
