name: rule-report

# 除外ルールの週次集計（ルールごとの除外件数・戻した件数・取りこぼし候補）を ruleReports に保存する。
# 毎週月曜 7:30（JST）と手動実行。点検画面とお知らせはこの集計を使う。
on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 0'

permissions:
  contents: read
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/723210521199/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@prtimes-inbox.iam.gserviceaccount.com
      - name: 週次集計
        run: npx tsx scripts/rule-report.ts
