  <g id="lights" filter="url(#blur)"><circle cx="330" cy="660" r="170" fill="#ffb21f"/><circle cx="640" cy="420" r="200" fill="#ff8a5c" fill-opacity=".75"/><circle cx="560" cy="760" r="150" fill="#ffd34d" fill-opacity=".8"/></g>
  <!-- 影と厚み（右下にずらした同じ形） -->
  <path d="M234 784 A78 78 0 1 0 390 784 A78 78 0 1 0 234 784 Z M312 490 A294 294 0 0 1 606 784 A58 58 0 0 1 490 784 A178 178 0 0 0 312 606 A58 58 0 0 1 312 490 Z M312 306 A478 478 0 0 1 790 784 A58 58 0 0 1 674 784 A362 362 0 0 0 312 422 A58 58 0 0 1 312 306 Z" fill="#050822" fill-opacity=".5" filter="url(#shadow)"/>
  <path d="M222 762 A78 78 0 1 0 378 762 A78 78 0 1 0 222 762 Z M300 468 A294 294 0 0 1 594 762 A58 58 0 0 1 478 762 A178 178 0 0 0 300 584 A58 58 0 0 1 300 468 Z M300 284 A478 478 0 0 1 778 762 A58 58 0 0 1 662 762 A362 362 0 0 0 300 400 A58 58 0 0 1 300 284 Z" fill="url(#side)"/>
