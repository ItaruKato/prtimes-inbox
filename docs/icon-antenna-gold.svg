    <rect x="-26" y="24" width="1024" height="1024" fill="url(#bg)"/>
    <g filter="url(#frost)"><g filter="url(#blur)"><circle cx="330" cy="660" r="170" fill="#ffb21f"/><circle cx="640" cy="420" r="200" fill="#ff8a5c" fill-opacity=".75"/><circle cx="560" cy="760" r="150" fill="#ffd34d" fill-opacity=".8"/></g></g>
    <rect width="1024" height="1024" fill="url(#tint)"/>
    <path d="M198 726 A78 78 0 1 0 354 726 A78 78 0 1 0 198 726 Z M276 432 A294 294 0 0 1 570 726 A58 58 0 0 1 454 726 A178 178 0 0 0 276 548 A58 58 0 0 1 276 432 Z M276 248 A478 478 0 0 1 754 726 A58 58 0 0 1 638 726 A362 362 0 0 0 276 364 A58 58 0 0 1 276 248 Z" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="18"/>
  </g>
  <path d="M208 740 A78 78 0 1 0 364 740 A78 78 0 1 0 208 740 Z M286 446 A294 294 0 0 1 580 740 A58 58 0 0 1 464 740 A178 178 0 0 0 286 562 A58 58 0 0 1 286 446 Z M286 262 A478 478 0 0 1 764 740 A58 58 0 0 1 648 740 A362 362 0 0 0 286 378 A58 58 0 0 1 286 262 Z" fill="none" stroke="url(#rim)" stroke-width="5" stroke-opacity="1"/>
  <path d="M286 462 A278 278 0 0 1 481 543" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-opacity=".85"/><path d="M286 278 A462 462 0 0 1 609 412" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-opacity=".8"/><ellipse cx="262" cy="710" rx="30" ry="20" fill="#fff" fill-opacity=".8" transform="rotate(-35 262 710)"/>
