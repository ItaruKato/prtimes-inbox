    <clipPath id="ant"><path d="M208 740 A78 78 0 1 0 364 740 A78 78 0 1 0 208 740 Z M286 446 A294 294 0 0 1 580 740 A58 58 0 0 1 464 740 A178 178 0 0 0 286 562 A58 58 0 0 1 286 446 Z M286 262 A478 478 0 0 1 764 740 A58 58 0 0 1 648 740 A362 362 0 0 0 286 378 A58 58 0 0 1 286 262 Z"/></clipPath>
