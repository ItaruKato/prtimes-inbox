<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b5bff"/><stop offset="1" stop-color="#7b3cff"/></linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="frost" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#050822" flood-opacity=".35"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card"><rect x="132" y="182" width="760" height="660" rx="96"/></clipPath>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".38" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity=".7"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2f9a"/><stop offset="1" stop-color="#1a1660"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g filter="url(#soft)"><circle cx="200" cy="200" r="320" fill="#33c3ff"/><circle cx="860" cy="260" r="280" fill="#ff6fd8"/><circle cx="700" cy="900" r="340" fill="#5b3cff"/><circle cx="140" cy="820" r="240" fill="#3b8bff"/></g>
  <!-- すりガラス：背景をぼかしたものを記事の形で切り抜き、白を重ねる -->
  <rect x="132" y="182" width="760" height="660" rx="96" fill="#000" fill-opacity=".001" filter="url(#sh)"/>
  <g clip-path="url(#card)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <g filter="url(#frost)"><g filter="url(#soft)"><circle cx="200" cy="200" r="320" fill="#33c3ff"/><circle cx="860" cy="260" r="280" fill="#ff6fd8"/><circle cx="700" cy="900" r="340" fill="#5b3cff"/><circle cx="140" cy="820" r="240" fill="#3b8bff"/></g></g>
    <rect x="132" y="182" width="760" height="660" fill="#fff" fill-opacity=".18"/>
    <rect x="132" y="182" width="760" height="330" fill="url(#hi)"/>
  </g>
  <rect x="136" y="186" width="752" height="652" rx="92" fill="none" stroke="url(#edge)" stroke-width="8" stroke-opacity=".95"/>
  <rect x="212" y="262" width="500" height="76" rx="38" fill="#fff" fill-opacity=".92"/>
  <circle cx="774" cy="300" r="38" fill="#ffe27a" filter="url(#glow)"/>
  <rect x="212" y="404" width="360" height="358" rx="52" fill="url(#panel)"/>
  <rect x="214" y="406" width="356" height="354" rx="50" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4"/>
  <g filter="url(#glow)">
    <circle cx="296" cy="676" r="42" fill="#ffe27a"/>
    <path d="M296 556 A120 120 0 0 1 416 676" fill="none" stroke="#ffe27a" stroke-width="46" stroke-linecap="round"/>
    <path d="M296 456 A220 220 0 0 1 516 676" fill="none" stroke="#ffe27aa8" stroke-width="46" stroke-linecap="round"/>
  </g>
  <rect x="616" y="420" width="196" height="46" rx="23" fill="#fff" fill-opacity=".78"/>
  <rect x="616" y="510" width="160" height="46" rx="23" fill="#fff" fill-opacity=".78"/>
  <rect x="616" y="600" width="196" height="46" rx="23" fill="#fff" fill-opacity=".78"/>
  <rect x="616" y="690" width="120" height="46" rx="23" fill="#fff" fill-opacity="0.47"/>
</svg>